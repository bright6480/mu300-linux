name: Build kernel with BBRv3

# Fork-only workflow: builds a mainline kernel with Google BBRv3 (tcp_bbr.c from google/bbr v3 branch)
# and packages it as a mu300-update kernel bundle.

on:
  workflow_dispatch:
    inputs:
      kv:
        description: 'Kernel version to build (e.g. 7.2.11)'
        required: false
        default: '7.2.11'
  push:
    paths:
      - '.github/workflows/build-bbr3.yml'
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    env:
      KV: ${{ inputs.kv || '7.2.11' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build environment
        run: docker build -t mu300-mainline-build upstream/

      - name: Inject BBRv3 source
        run: |
          mkdir -p bbr3
          curl -fsSL https://raw.githubusercontent.com/google/bbr/v3/net/ipv4/tcp_bbr.c -o bbr3/tcp_bbr.c
          grep -q 'BBR_VERSION 3' bbr3/tcp_bbr.c || { echo 'not BBRv3 source'; exit 1; }
          grep -q '\.name.*=.*"bbr"' bbr3/tcp_bbr.c || { echo 'unexpected registration name'; exit 1; }
          echo "BBRv3 source: $(wc -l < bbr3/tcp_bbr.c) lines, KV=$KV"

      - name: Build kernel (BBRv3 replaces net/ipv4/tcp_bbr.c before make)
        run: |
          docker volume create mu300-mainline
          docker run --rm -e KV="$KV" -v mu300-mainline:/src -v "$PWD/upstream":/work -v "$PWD/bbr3":/bbr3 \
            mu300-mainline-build bash -euc '
              bash /work/build.sh
              echo "== replacing tcp_bbr.c with BBRv3 and rebuilding =="
              cp /bbr3/tcp_bbr.c /src/linux-$KV/net/ipv4/tcp_bbr.c
              grep -c "BBR_VERSION 3" /src/linux-$KV/net/ipv4/tcp_bbr.c
              cd /src/linux-$KV
              make O=/src/out-$KV ARCH=arm64 -j"$(nproc)" Image 2>&1 | tail -20
              strings /src/out-$KV/arch/arm64/boot/Image | grep -m1 "Linux version"
              cp /src/out-$KV/arch/arm64/boot/Image /work/out/Image
            '

      - name: Vendor modules
        run: |
          docker run --rm -e KV="$KV" -v mu300-mainline:/src -v "$PWD/upstream":/work \
            mu300-mainline-build bash /work/build-modules.sh > /dev/null
          ls upstream/out/modules/*.ko | wc -l

      - name: Collect build outputs
        run: |
          docker run --rm -e KV="$KV" -v mu300-mainline:/src -v "$PWD/upstream":/work mu300-mainline-build bash -euc '
            cp /src/out-$KV/arch/arm64/boot/Image /work/out/Image
            cp /src/out-$KV/modules.builtin /src/out-$KV/modules.builtin.modinfo /work/out/ 2>/dev/null || true
            cp /src/out-$KV/.config /work/out/kernel.config
            mkdir -p /work/out/modules
            find /src/out-$KV -name "*.ko" -exec cp {} /work/out/modules/ \; 2>/dev/null || true
            ls -la /work/out/ | head
          '

      - name: Make kernel bundle
        run: |
          mkdir -p release/ref
          curl -fsSL -o release/ref/mu300-kernel.tar.gz \
            https://github.com/dikeckaan/mu300-linux/releases/download/v2026.10.27/mu300-kernel.tar.gz
          MU300_UPSTREAM_OUT="$PWD/upstream/out" sh upstream/make-bundle.sh \
            "$PWD/mu300-kernel-${KV}-bbr3.tar.gz" release/ref/mu300-kernel.tar.gz
          ls -la mu300-kernel-*.tar.gz

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: mu300-kernel-${{ env.KV }}-bbr3
          path: mu300-kernel-${{ env.KV }}-bbr3.tar.gz
          retention-days: 30
