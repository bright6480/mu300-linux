name: Build tcp_bbr3.ko for 7.2

# Builds hrimfaxi/tcp_bbr_modules BBRv3 backport as an out-of-tree module against
# the MU300 mainline 7.2 tree, and uploads tcp_bbr3.ko.
# No kernel source is patched: the module registers as "bbr3" next to the built-in "bbr".

on:
  workflow_dispatch:
    inputs:
      kv:
        description: 'Kernel version to build against (e.g. 7.2.11)'
        required: false
        default: '7.2.11'
  push:
    paths:
      - '.github/workflows/build-bbr3.yml'
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    env:
      KV: ${{ inputs.kv || '7.2.11' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build environment
        run: docker build -t mu300-mainline-build upstream/

      - name: Prepare 7.2 kernel tree (upstream/build.sh)
        run: |
          docker volume create mu300-mainline
          docker run --rm -e KV="$KV" -v mu300-mainline:/src -v "$PWD/upstream":/work \
            mu300-mainline-build bash /work/build.sh

      - name: Prepare source tree in-tree, probe API, build tcp_bbr3.ko
        run: |
          git clone --depth 1 https://github.com/hrimfaxi/tcp_bbr_modules bbr3mod
          docker run --rm -e KV="$KV" -v mu300-mainline:/src -v "$PWD/upstream":/work -v "$PWD/bbr3mod":/bbr3mod \
            mu300-mainline-build bash -euo pipefail -c '
              # gen_kconfig.py probes with "make -C \$KDIR M=... modules" and no O=,
              # which needs an in-tree prepared source root (build.sh used O= out-of-tree).
              cd /src/linux-$KV
              cp /src/out-$KV/.config .
              make ARCH=arm64 modules_prepare > /tmp/prepare.log 2>&1 || { tail -30 /tmp/prepare.log; exit 1; }
              echo "source tree prepared in-tree"
              cd /bbr3mod
              make distclean >/dev/null 2>&1 || true
              rm -f kernel_config.h
              python3 gen_kconfig.py /src/linux-$KV kernel_config.h gcc kapi_checklist -j "$(nproc)" -a arm64
              echo "--- HAVE_ macros ---"
              grep -c "define HAVE_" kernel_config.h
              # build.sh only built Image (no Module.symvers); downgrade modpost
              # to warnings - runtime resolution stays with the kernel.
              make -C /src/linux-$KV M=/bbr3mod ARCH=arm64 KBUILD_MODPOST_WARN=1 modules 2>&1 | tail -15
              ls -la tcp_bbr3.ko
              echo -n "vermagic: "; strings tcp_bbr3.ko | grep vermagic | head -1 || true
              mkdir -p /work/out && cp tcp_bbr3.ko kernel_config.h /work/out/
            '

      - name: Audit undefined symbols
        run: |
          docker run --rm -v mu300-mainline:/src -v "$PWD/bbr3mod":/bbr3mod mu300-mainline-build \
            bash /bbr3mod/audit_symbols.sh /src/linux-$KV 2>&1 | tail -20 || true

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: tcp_bbr3-ko-${{ env.KV }}
          path: |
            bbr3mod/tcp_bbr3.ko
            bbr3mod/kernel_config.h
          retention-days: 30
